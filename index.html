<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BC Development Project Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google API -->
  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-blue-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="logo.png" alt="BC Development" class="h-12">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">BC Development Project Dashboard</h1>
          <p class="text-sm text-gray-500">Project Navigator met Real-time Drive Integratie</p>
        </div>
      </div>
      <div id="userInfo"></div>
    </div>
  </header>

  <!-- Auth Banner -->
  <div id="authBanner" class="hidden bg-blue-50 border-b border-blue-300 p-3 text-center">
    <button onclick="handleAuthClick()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700">
      🔐 Log in met Google
    </button>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Projects Overview -->
    <section class="mb-8">
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        📁 Projecten
      </h2>
      <div id="projectsOverview" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Projects will be loaded here -->
      </div>
    </section>

    <!-- Project Selector -->
    <div class="mb-6 max-w-2xl mx-auto">
      <label class="block text-sm font-medium mb-2">Selecteer Project:</label>
      <select id="projectSelector" class="w-full p-3 border rounded-lg bg-white shadow-sm">
        <option value="">-- Kies een project --</option>
      </select>
    </div>

    <!-- Search -->
    <div class="mb-6 max-w-2xl mx-auto">
      <input type="text" id="searchInput" placeholder="🔍 Zoek categorie of bestand..." 
             class="w-full p-3 border rounded-lg shadow-sm">
    </div>

    <!-- Project Info Banner (hidden by default) -->
    <div id="projectInfo" class="hidden"></div>

    <!-- Categories Grid -->
    <div id="categoriesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Categories will be loaded here -->
    </div>

  </main>

  <!-- File Modal -->
  <div id="fileModal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[80vh] flex flex-col">
      <div class="p-4 border-b flex justify-between items-center">
        <h3 id="modalTitle" class="text-xl font-bold"></h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
      </div>
      <div id="modalContent" class="p-4 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <!-- Scripts - VERSIE 4 VOOR CACHE BYPASS -->
  <script src="config.js?v=4"></script>
  <script src="auth.js?v=4"></script>
  <script src="drive-api.js?v=4"></script>
  <script src="ui.js?v=4"></script>
  <script src="main.js?v=4"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BC Development Project Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

    <!-- NIEUW: Define global functions BEFORE Google APIs load -->
  <script>
    // Initialize global state
    window.gapiInited = false;
    window.gisInited = false;
    window.tokenClient = null;
    window.CURRENT_USER_EMAIL = null;
    window.DYNAMIC_PROJECTS = [];
    
    // Placeholder functions that will be called by Google APIs
    window.gapiLoaded = function() {
      console.log('⏳ GAPI loaded, waiting for initialization...');
      // Will be properly initialized by auth.js
    };
    
    window.gisLoaded = function() {
      console.log('⏳ GIS loaded, waiting for initialization...');
      // Will be properly initialized by auth.js
    };
  </script>
  
  <!-- Google API -->
  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
  
  <!-- Custom Styles - FIXED PATH -->
  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-blue-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="assets/BCDevelopment1.jpg" alt="BC Development" class="h-12">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">BC Development Project Dashboard</h1>
          <p class="text-sm text-gray-500">Project Navigator met Real-time Drive Integratie</p>
        </div>
      </div>
      <div id="userInfo"></div>
      
      <!-- Settings Button -->
      <button onclick="toggleSettings()" class="ml-4 text-gray-600 hover:text-gray-800" title="Instellingen">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Settings Panel (hidden by default) -->
  <div id="settingsPanel" class="hidden fixed top-20 right-4 bg-white rounded-lg shadow-xl border p-4 z-40 w-80">
    <h3 class="font-bold text-lg mb-3">⚙️ Instellingen</h3>
    
    <div class="space-y-3">
      <!-- Auto-refresh toggle -->
      <div class="flex items-center justify-between">
        <label class="text-sm font-medium">Auto-refresh</label>
        <button onclick="toggleAutoRefresh()" id="autoRefreshToggle" 
                class="px-3 py-1 rounded text-sm bg-green-100 text-green-800">
          ✓ Actief
        </button>
      </div>
      
      <!-- Cache info -->
      <div class="border-t pt-3">
        <div class="text-sm font-medium mb-2">Cache</div>
        <div id="cacheStats" class="text-xs text-gray-600 mb-2">
          Laden...
        </div>
        <button onclick="clearCache()" class="text-sm text-red-600 hover:text-red-800">
          🗑️ Cache wissen
        </button>
      </div>
      
      <!-- Sign out -->
      <div class="border-t pt-3">
        <button onclick="handleSignOut()" class="w-full text-sm bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded">
          🚪 Uitloggen
        </button>
      </div>
    </div>
  </div>

  <!-- Auth Banner -->
  <div id="authBanner" class="hidden bg-blue-50 border-b border-blue-300 p-3 text-center">
    <button onclick="handleAuthClick()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700">
      🔐 Log in met Google
    </button>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Projects Overview -->
    <section class="mb-8">
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        📁 Projecten
      </h2>
      <div id="projectsOverview" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Projects will be loaded here -->
      </div>
    </section>

    <!-- Project Selector -->
    <div class="mb-6 max-w-2xl mx-auto">
      <label class="block text-sm font-medium mb-2">Selecteer Project:</label>
      <select id="projectSelector" class="w-full p-3 border rounded-lg bg-white shadow-sm">
        <option value="">-- Kies een project --</option>
      </select>
    </div>

    <!-- Search -->
    <div class="mb-6 max-w-2xl mx-auto">
      <input type="text" id="searchInput" placeholder="🔍 Zoek categorie of bestand..." 
             class="w-full p-3 border rounded-lg shadow-sm">
    </div>

    <!-- Project Info Banner (hidden by default) -->
    <div id="projectInfo" class="hidden"></div>

    <!-- Categories Grid -->
    <div id="categoriesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Categories will be loaded here -->
    </div>

  </main>

  <!-- File Modal -->
  <div id="fileModal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[80vh] flex flex-col">
      <div class="p-4 border-b flex justify-between items-center">
        <h3 id="modalTitle" class="text-xl font-bold"></h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
      </div>
      <div id="modalContent" class="p-4 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <!-- Scripts - VERSIE 7 met Error Recovery (CORRECTE VOLGORDE!) -->
  <script src="js/config.js?v=7"></script>
  <script src="js/cache-manager.js?v=7"></script>
  <script src="js/auto-refresh.js?v=7"></script>
  <script src="js/error-recovery.js?v=7"></script>
  <script src="js/auth.js?v=7"></script>
  <script src="js/drive-api.js?v=7"></script>
  <script src="js/ui.js?v=7"></script>
  <script src="js/main.js?v=7"></script>

</body>
</html>
